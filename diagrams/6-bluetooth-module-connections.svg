<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 620" width="100%" height="100%" style="background:#ffffff; font-family:'Inter', system-ui, sans-serif;">
  <defs>
    <filter id="shd6" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bt-pcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect x="15" y="15" width="920" height="590" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="475" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">HC-05 BLUETOOTH MODULE INTERFACE &amp; VOLTAGE DIVIDER</text>
  <text x="475" y="68" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">2.4GHz SERIAL SPP TELEMETRY, 3.3V LEVEL SHIFTER &amp; COMMAND SET</text>

  <!-- LEFT: HC-05 MODULE -->
  <g transform="translate(60, 110)">
    <rect width="260" height="360" rx="12" fill="url(#bt-pcb)" stroke="#0284c7" stroke-width="2" filter="url(#shd6)"/>
    <text x="130" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">HC-05 BLUETOOTH SPP</text>

    <!-- Meander RF Antenna (Gold Trace on PCB) -->
    <path d="M 60,45 L 200,45 L 200,55 L 70,55 L 70,65 L 190,65 L 190,75 L 80,75 L 80,85 L 180,85" fill="none" stroke="#facc15" stroke-width="2.5"/>
    <text x="130" y="105" text-anchor="middle" font-size="9" font-weight="600" fill="#fef08a">2.4 GHz RF Antenna</text>

    <!-- CSR BC417 Chip -->
    <rect x="60" y="125" width="140" height="85" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="130" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">CSR BC417</text>
    <text x="130" y="178" text-anchor="middle" font-size="9" fill="#94a3b8">Bluetooth 2.0 + EDR</text>
    <text x="130" y="195" text-anchor="middle" font-size="8" fill="#38bdf8">3.3V Logic Core</text>

    <!-- 6 Pin Header (Bottom) -->
    <g transform="translate(20, 260)">
      <rect width="220" height="30" rx="4" fill="#0f172a"/>
      <circle cx="20" cy="15" r="4" fill="#facc15"/>
      <circle cx="55" cy="15" r="4" fill="#facc15"/>
      <circle cx="90" cy="15" r="4" fill="#facc15"/>
      <circle cx="130" cy="15" r="4" fill="#facc15"/>
      <circle cx="165" cy="15" r="4" fill="#facc15"/>
      <circle cx="200" cy="15" r="4" fill="#facc15"/>
      
      <g font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">
        <text x="20" y="46">STATE</text>
        <text x="55" y="46">RXD</text>
        <text x="90" y="46">TXD</text>
        <text x="130" y="46">GND</text>
        <text x="165" y="46">VCC</text>
        <text x="200" y="46">EN</text>
      </g>
    </g>

    <text x="130" y="340" text-anchor="middle" font-size="9" fill="#e0f2fe">Baud Rate: 9600 bps, 8-N-1</text>
  </g>

  <!-- CENTER: 3.3V VOLTAGE DIVIDER CIRCUIT -->
  <g transform="translate(370, 110)">
    <rect width="250" height="360" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shd6)"/>
    <rect width="250" height="32" rx="12" fill="#334155"/>
    <rect y="22" width="250" height="10" fill="#334155"/>
    <text x="125" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">LEVEL SHIFTER CIRCUIT</text>

    <text x="125" y="58" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b91c1c">Voltage Divider on HC-05 RXD</text>
    <text x="125" y="74" text-anchor="middle" font-size="9" fill="#64748b">Steps down 5V Arduino TX to safe 3.3V</text>

    <!-- Schematic Drawing -->
    <g transform="translate(35, 90)">
      <!-- Input line from Arduino D3 -->
      <line x1="0" y1="20" x2="40" y2="20" stroke="#0284c7" stroke-width="2"/>
      <text x="0" y="12" font-size="9" font-weight="700" fill="#0284c7">Arduino D3 (5V)</text>

      <!-- Resistor R1 (1k) -->
      <rect x="40" y="10" width="45" height="20" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
      <text x="62" y="24" text-anchor="middle" font-size="8.5" font-weight="700" fill="#713f12">R1 = 1kΩ</text>

      <!-- Center Node -->
      <line x1="85" y1="20" x2="135" y2="20" stroke="#0284c7" stroke-width="2"/>
      <circle cx="110" cy="20" r="3.5" fill="#0f172a"/>

      <!-- Output to HC-05 RXD -->
      <line x1="110" y1="20" x2="175" y2="20" stroke="#0284c7" stroke-width="2"/>
      <text x="175" y="12" text-anchor="end" font-size="9" font-weight="700" fill="#0284c7">To RXD (3.3V)</text>

      <!-- Resistor R2 (2k) down to GND -->
      <line x1="110" y1="20" x2="110" y2="50" stroke="#0f172a" stroke-width="2"/>
      <rect x="90" y="50" width="40" height="30" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
      <text x="110" y="70" text-anchor="middle" font-size="8.5" font-weight="700" fill="#713f12">R2 = 2kΩ</text>
      
      <!-- Ground Symbol -->
      <line x1="110" y1="80" x2="110" y2="100" stroke="#0f172a" stroke-width="2"/>
      <line x1="95" y1="100" x2="125" y2="100" stroke="#0f172a" stroke-width="2"/>
      <line x1="100" y1="105" x2="120" y2="105" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="105" y1="110" x2="115" y2="110" stroke="#0f172a" stroke-width="1"/>
      <text x="135" y="105" font-size="9" fill="#64748b">GND</text>
    </g>

    <!-- Calculation Callout -->
    <rect x="15" y="235" width="220" height="55" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="125" y="254" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1d4ed8">V_out = 5V × (2k / (1k + 2k))</text>
    <text x="125" y="274" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1e40af">= 3.33 V (Safe for CSR Chip)</text>

    <!-- Direct TX Line Note -->
    <rect x="15" y="300" width="220" height="42" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="125" y="318" text-anchor="middle" font-size="9" font-weight="700" fill="#047857">HC-05 TXD ──► Direct to Pin 2</text>
    <text x="125" y="332" text-anchor="middle" font-size="8" fill="#64748b">3.3V logic exceeds 3.0V TTL HIGH threshold</text>
  </g>

  <!-- RIGHT: ARDUINO & TELEMETRY COMMANDS -->
  <g transform="translate(660, 110)">
    <rect width="230" height="360" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#shd6)"/>
    <rect width="230" height="32" rx="12" fill="#2563eb"/>
    <rect y="22" width="230" height="10" fill="#2563eb"/>
    <text x="115" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">SMARTPHONE COMMANDS</text>

    <!-- Serial Table -->
    <g transform="translate(15, 45)">
      <rect width="200" height="24" fill="#f1f5f9" rx="4"/>
      <text x="35" y="16" text-anchor="middle" font-size="9.5" font-weight="700" fill="#334155">Key</text>
      <text x="120" y="16" text-anchor="middle" font-size="9.5" font-weight="700" fill="#334155">Operational Command</text>

      <g font-size="9.5" font-family="'JetBrains Mono', monospace" fill="#0f172a">
        <!-- 'F' -->
        <text x="35" y="44" text-anchor="middle" font-weight="700" fill="#2563eb">'F'</text>
        <text x="120" y="44" text-anchor="middle">Forward Drive</text>
        <!-- 'B' -->
        <text x="35" y="68" text-anchor="middle" font-weight="700" fill="#2563eb">'B'</text>
        <text x="120" y="68" text-anchor="middle">Reverse Drive</text>
        <!-- 'L' -->
        <text x="35" y="92" text-anchor="middle" font-weight="700" fill="#2563eb">'L'</text>
        <text x="120" y="92" text-anchor="middle">Pivot Turn Left</text>
        <!-- 'R' -->
        <text x="35" y="116" text-anchor="middle" font-weight="700" fill="#2563eb">'R'</text>
        <text x="120" y="116" text-anchor="middle">Pivot Turn Right</text>
        <!-- 'S' -->
        <text x="35" y="140" text-anchor="middle" font-weight="700" fill="#dc2626">'S'</text>
        <text x="120" y="140" text-anchor="middle">Stop Motors</text>
        
        <line x1="0" y1="152" x2="200" y2="152" stroke="#e2e8f0" stroke-width="1"/>
        
        <!-- Mode Switches -->
        <text x="35" y="174" text-anchor="middle" font-weight="700" fill="#059669">'1'</text>
        <text x="120" y="174" text-anchor="middle">Mode: Line Tracking</text>
        <text x="35" y="198" text-anchor="middle" font-weight="700" fill="#059669">'2'</text>
        <text x="120" y="198" text-anchor="middle">Mode: Obstacle Avoid</text>
        <text x="35" y="222" text-anchor="middle" font-weight="700" fill="#0284c7">'3'</text>
        <text x="120" y="222" text-anchor="middle">Mode: Bluetooth Drive</text>
        <text x="35" y="246" text-anchor="middle" font-weight="700" fill="#dc2626">'0'</text>
        <text x="120" y="246" text-anchor="middle">Emergency Standby</text>
      </g>
    </g>

    <!-- App Info Box -->
    <rect x="15" y="305" width="200" height="40" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="115" y="322" text-anchor="middle" font-size="8.5" font-weight="600" fill="#334155">Standard Bluetooth SPP Terminal</text>
    <text x="115" y="336" text-anchor="middle" font-size="8" fill="#64748b">Compatible with Android / iOS Serial Apps</text>
  </g>

  <!-- BOTTOM SUMMARY BANNER -->
  <g transform="translate(60, 500)">
    <rect width="830" height="80" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shd6)"/>
    <text x="415" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">SOFTWARE SERIAL IMPLEMENTATION &amp; PIN MAPPING</text>
    <text x="415" y="46" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#1d4ed8">SoftwareSerial bluetooth(2, 3); // Pin 2 = RX (from BT TX), Pin 3 = TX (to BT RX via Divider)</text>
    <text x="415" y="66" text-anchor="middle" font-size="9" fill="#64748b">Keeps Hardware Serial Pins D0/D1 free for sketch uploading and USB Serial Monitor debugging.</text>
  </g>
</svg>
