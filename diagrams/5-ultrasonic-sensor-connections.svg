<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 620" width="100%" height="100%" style="background:#ffffff; font-family:'Inter', system-ui, sans-serif;">
  <defs>
    <filter id="shd5" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="us-pcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="transducer-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect x="15" y="15" width="920" height="590" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="475" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">HC-SR04 ULTRASONIC RANGE SENSOR INTERFACE</text>
  <text x="475" y="68" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">TIME-OF-FLIGHT (ToF) ACOUSTIC RANGING &amp; TIMING DIAGRAM</text>

  <!-- LEFT: PHYSICAL SENSOR MODULE -->
  <g transform="translate(50, 110)">
    <rect width="380" height="230" rx="12" fill="url(#us-pcb)" stroke="#1e3a8a" stroke-width="2" filter="url(#shd5)"/>
    <text x="190" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">HC-SR04 ULTRASONIC TRANSDUCER</text>

    <!-- Ultrasonic Emitter "T" (Left Transducer) -->
    <circle cx="105" cy="105" r="48" fill="url(#transducer-grad)" stroke="#475569" stroke-width="3"/>
    <circle cx="105" cy="105" r="38" fill="#1e293b"/>
    <circle cx="105" cy="105" r="16" fill="#64748b"/>
    <text x="105" y="112" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">T</text>
    <text x="105" y="170" text-anchor="middle" font-size="10" font-weight="600" fill="#e2e8f0">40kHz Transmitter</text>

    <!-- Ultrasonic Receiver "R" (Right Transducer) -->
    <circle cx="275" cy="105" r="48" fill="url(#transducer-grad)" stroke="#475569" stroke-width="3"/>
    <circle cx="275" cy="105" r="38" fill="#1e293b"/>
    <circle cx="275" cy="105" r="16" fill="#64748b"/>
    <text x="275" y="112" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">R</text>
    <text x="275" y="170" text-anchor="middle" font-size="10" font-weight="600" fill="#e2e8f0">Piezo Receiver</text>

    <!-- 4 Pin Header (Bottom Center) -->
    <rect x="110" y="195" width="160" height="26" rx="4" fill="#0f172a"/>
    <circle cx="130" cy="208" r="4" fill="#facc15"/>
    <circle cx="170" cy="208" r="4" fill="#facc15"/>
    <circle cx="210" cy="208" r="4" fill="#facc15"/>
    <circle cx="250" cy="208" r="4" fill="#facc15"/>
    <text x="130" y="190" text-anchor="middle" font-size="9" font-weight="700" fill="#fecaca">VCC</text>
    <text x="170" y="190" text-anchor="middle" font-size="9" font-weight="700" fill="#fef08a">TRIG</text>
    <text x="210" y="190" text-anchor="middle" font-size="9" font-weight="700" fill="#bfdbfe">ECHO</text>
    <text x="250" y="190" text-anchor="middle" font-size="9" font-weight="700" fill="#cbd5e1">GND</text>
  </g>

  <!-- RIGHT: ARDUINO UNO PIN INTERFACE -->
  <g transform="translate(480, 110)">
    <rect width="420" height="230" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#shd5)"/>
    <rect width="420" height="32" rx="12" fill="#2563eb"/>
    <rect y="22" width="420" height="10" fill="#2563eb"/>
    <text x="210" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">ARDUINO UNO CONNECTION MAPPING</text>

    <g transform="translate(25, 55)">
      <!-- Row 1: VCC -->
      <rect width="370" height="34" rx="6" fill="#fef2f2" stroke="#fecaca"/>
      <text x="15" y="22" font-size="11" font-weight="700" fill="#dc2626">VCC Pin</text>
      <text x="140" y="22" font-size="11" fill="#0f172a">Connected to +5V Power Rail</text>
      <text x="320" y="22" font-size="10" font-family="'JetBrains Mono', monospace" fill="#dc2626">+5V DC (15mA)</text>

      <!-- Row 2: TRIG -->
      <g transform="translate(0, 42)">
        <rect width="370" height="34" rx="6" fill="#fffbeb" stroke="#fde68a"/>
        <text x="15" y="22" font-size="11" font-weight="700" fill="#b45309">TRIG Pin</text>
        <text x="140" y="22" font-size="11" fill="#0f172a">Arduino Analog Pin A0 (Output)</text>
        <text x="320" y="22" font-size="10" font-family="'JetBrains Mono', monospace" fill="#b45309">10µs Pulse</text>
      </g>

      <!-- Row 3: ECHO -->
      <g transform="translate(0, 84)">
        <rect width="370" height="34" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="15" y="22" font-size="11" font-weight="700" fill="#1d4ed8">ECHO Pin</text>
        <text x="140" y="22" font-size="11" fill="#0f172a">Arduino Analog Pin A1 (Input)</text>
        <text x="320" y="22" font-size="10" font-family="'JetBrains Mono', monospace" fill="#1d4ed8">pulseIn()</text>
      </g>

      <!-- Row 4: GND -->
      <g transform="translate(0, 126)">
        <rect width="370" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="15" y="22" font-size="11" font-weight="700" fill="#334155">GND Pin</text>
        <text x="140" y="22" font-size="11" fill="#0f172a">Common System Ground</text>
        <text x="320" y="22" font-size="10" font-family="'JetBrains Mono', monospace" fill="#64748b">0V Return</text>
      </g>
    </g>
  </g>

  <!-- LOWER: TIMING WAVEFORM & PHYSICS FORMULA -->
  <g transform="translate(50, 365)">
    <rect width="850" height="225" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shd5)"/>
    <text x="425" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">PULSE TIMING DIAGRAM &amp; RANGE CALCULATION</text>

    <!-- Waveform Area -->
    <g transform="translate(40, 50)">
      <!-- Trig Signal Line -->
      <text x="0" y="24" font-size="10" font-weight="700" fill="#b45309">Trig (Pin A0):</text>
      <path d="M 120,28 L 160,28 L 160,8 L 190,8 L 190,28 L 480,28" fill="none" stroke="#b45309" stroke-width="2"/>
      <text x="175" y="4" text-anchor="middle" font-size="8.5" font-family="'JetBrains Mono', monospace" fill="#b45309">10 µs Pulse</text>

      <!-- Sonic Burst Line -->
      <text x="0" y="65" font-size="10" font-weight="700" fill="#0284c7">Ultrasonic Out:</text>
      <path d="M 120,70 L 205,70 L 210,60 L 215,80 L 220,60 L 225,80 L 230,60 L 235,80 L 240,60 L 245,70 L 480,70" fill="none" stroke="#0284c7" stroke-width="1.5"/>
      <text x="230" y="52" text-anchor="middle" font-size="8.5" font-family="'JetBrains Mono', monospace" fill="#0284c7">8 Cycles of 40 kHz Sound</text>

      <!-- Echo Signal Line -->
      <text x="0" y="112" font-size="10" font-weight="700" fill="#1d4ed8">Echo (Pin A1):</text>
      <path d="M 120,118 L 245,118 L 245,95 L 420,95 L 420,118 L 480,118" fill="none" stroke="#1d4ed8" stroke-width="2"/>
      <line x1="245" y1="130" x2="420" y2="130" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="332" y="142" text-anchor="middle" font-size="9" font-weight="700" fill="#1d4ed8">Time-of-Flight Duration (Δt)</text>
    </g>

    <!-- Mathematical Formula Box (Right) -->
    <g transform="translate(540, 50)">
      <rect width="280" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="140" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">DISTANCE COMPUTATION</text>
      
      <rect x="20" y="38" width="240" height="42" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="140" y="56" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1d4ed8">Distance = (Δt × 0.034) / 2</text>
      <text x="140" y="72" text-anchor="middle" font-size="8.5" fill="#64748b">Speed of Sound in Air = 340 m/s = 0.034 cm/µs</text>

      <text x="25" y="105" font-size="9.5" font-weight="700" fill="#047857">Braking Threshold: 20 cm</text>
      <text x="25" y="122" font-size="8.5" fill="#334155">• Distance &gt; 20 cm: Normal forward drive</text>
      <text x="25" y="136" font-size="8.5" fill="#b91c1c">• Distance ≤ 20 cm: Stop, Reverse &amp; Steer Right</text>
    </g>
  </g>
</svg>
