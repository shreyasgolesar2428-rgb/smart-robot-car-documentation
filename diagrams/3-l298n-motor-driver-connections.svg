<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 620" width="100%" height="100%" style="background:#ffffff; font-family:'Inter', system-ui, sans-serif;">
  <defs>
    <filter id="shd3" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="heatsink-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="l298n-pcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect x="15" y="15" width="920" height="590" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="475" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">L298N DUAL H-BRIDGE MOTOR DRIVER CONNECTIONS</text>
  <text x="475" y="68" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">POWER STAGE, LOGIC SIGNALS &amp; FOUR DC MOTOR WIRING</text>

  <!-- LEFT MOTORS (M1 & M2) -->
  <g transform="translate(40, 180)">
    <rect width="180" height="230" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shd3)"/>
    <rect width="180" height="28" rx="10" fill="#334155"/>
    <text x="90" y="19" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">LEFT DC MOTORS (x2)</text>
    
    <!-- Motor 1 (Front Left) -->
    <rect x="15" y="42" width="150" height="70" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <circle cx="45" cy="77" r="18" fill="#e2e8f0" stroke="#64748b"/>
    <text x="45" y="81" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">M1</text>
    <text x="105" y="70" font-size="10" font-weight="600" fill="#0f172a">Front-Left</text>
    <text x="105" y="86" font-size="9" fill="#64748b">BO 1:48 Gear</text>

    <!-- Motor 2 (Rear Left) -->
    <rect x="15" y="125" width="150" height="70" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <circle cx="45" cy="160" r="18" fill="#e2e8f0" stroke="#64748b"/>
    <text x="45" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">M2</text>
    <text x="105" y="153" font-size="10" font-weight="600" fill="#0f172a">Rear-Left</text>
    <text x="105" y="169" font-size="9" fill="#64748b">BO 1:48 Gear</text>

    <text x="90" y="215" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2563eb">Connected in Parallel to OUT1/OUT2</text>
  </g>

  <!-- L298N BOARD (Center) -->
  <g transform="translate(290, 110)">
    <rect width="370" height="390" rx="12" fill="url(#l298n-pcb)" stroke="#7f1d1d" stroke-width="2.5" filter="url(#shd3)"/>

    <!-- Large Aluminum Heatsink -->
    <rect x="95" y="40" width="180" height="90" rx="4" fill="url(#heatsink-grad)" stroke="#0f172a" stroke-width="2"/>
    <!-- Heatsink Fins -->
    <line x1="120" y1="40" x2="120" y2="130" stroke="#475569" stroke-width="3"/>
    <line x1="145" y1="40" x2="145" y2="130" stroke="#475569" stroke-width="3"/>
    <line x1="170" y1="40" x2="170" y2="130" stroke="#475569" stroke-width="3"/>
    <line x1="195" y1="40" x2="195" y2="130" stroke="#475569" stroke-width="3"/>
    <line x1="220" y1="40" x2="220" y2="130" stroke="#475569" stroke-width="3"/>
    <line x1="245" y1="40" x2="245" y2="130" stroke="#475569" stroke-width="3"/>
    <text x="185" y="90" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="2">L298N IC</text>

    <!-- OUT1 / OUT2 Screw Terminal Block (Left) -->
    <rect x="8" y="160" width="40" height="70" rx="4" fill="#15803d" stroke="#166534" stroke-width="2"/>
    <circle cx="28" cy="180" r="7" fill="#facc15" stroke="#ca8a04"/>
    <circle cx="28" cy="210" r="7" fill="#facc15" stroke="#ca8a04"/>
    <text x="56" y="184" font-size="10" font-weight="700" fill="#ffffff">OUT1</text>
    <text x="56" y="214" font-size="10" font-weight="700" fill="#ffffff">OUT2</text>

    <!-- OUT3 / OUT4 Screw Terminal Block (Right) -->
    <rect x="322" y="160" width="40" height="70" rx="4" fill="#15803d" stroke="#166534" stroke-width="2"/>
    <circle cx="342" cy="180" r="7" fill="#facc15" stroke="#ca8a04"/>
    <circle cx="342" cy="210" r="7" fill="#facc15" stroke="#ca8a04"/>
    <text x="314" y="184" text-anchor="end" font-size="10" font-weight="700" fill="#ffffff">OUT3</text>
    <text x="314" y="214" text-anchor="end" font-size="10" font-weight="700" fill="#ffffff">OUT4</text>

    <!-- 3-Pin Power Screw Terminal Block (Bottom Left) -->
    <rect x="40" y="325" width="105" height="45" rx="4" fill="#15803d" stroke="#166534" stroke-width="2"/>
    <circle cx="60" cy="348" r="7" fill="#facc15"/>
    <circle cx="92" cy="348" r="7" fill="#facc15"/>
    <circle cx="125" cy="348" r="7" fill="#facc15"/>
    <text x="60" y="320" text-anchor="middle" font-size="9" font-weight="700" fill="#fef08a">VMS(+12V)</text>
    <text x="92" y="320" text-anchor="middle" font-size="9" font-weight="700" fill="#fef08a">GND</text>
    <text x="125" y="320" text-anchor="middle" font-size="9" font-weight="700" fill="#fef08a">+5V OUT</text>

    <!-- 6-Pin Logic Male Header (Bottom Right) -->
    <rect x="195" y="335" width="150" height="30" rx="3" fill="#0f172a"/>
    <circle cx="210" cy="350" r="3.5" fill="#e2e8f0"/>
    <circle cx="232" cy="350" r="3.5" fill="#e2e8f0"/>
    <circle cx="254" cy="350" r="3.5" fill="#e2e8f0"/>
    <circle cx="276" cy="350" r="3.5" fill="#e2e8f0"/>
    <circle cx="298" cy="350" r="3.5" fill="#e2e8f0"/>
    <circle cx="320" cy="350" r="3.5" fill="#e2e8f0"/>
    <g font-size="8.5" font-weight="700" fill="#fef08a" text-anchor="middle">
      <text x="210" y="328">ENA</text>
      <text x="232" y="328">IN1</text>
      <text x="254" y="328">IN2</text>
      <text x="276" y="328">IN3</text>
      <text x="298" y="328">IN4</text>
      <text x="320" y="328">ENB</text>
    </g>

    <!-- 5V Regulator & Filter Caps -->
    <rect x="50" y="260" width="30" height="25" rx="3" fill="#334155"/>
    <text x="65" y="276" text-anchor="middle" font-size="7" fill="#ffffff">78M05</text>
    <circle cx="110" cy="272" r="10" fill="#0284c7" stroke="#0369a1"/>
    <text x="110" y="276" text-anchor="middle" font-size="7" fill="#ffffff">Cap</text>

    <!-- Board Label -->
    <text x="185" y="15" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">L298N DUAL H-BRIDGE MODULE</text>
  </g>

  <!-- RIGHT MOTORS (M3 & M4) -->
  <g transform="translate(730, 180)">
    <rect width="180" height="230" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shd3)"/>
    <rect width="180" height="28" rx="10" fill="#334155"/>
    <text x="90" y="19" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">RIGHT DC MOTORS (x2)</text>
    
    <!-- Motor 3 (Front Right) -->
    <rect x="15" y="42" width="150" height="70" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <circle cx="45" cy="77" r="18" fill="#e2e8f0" stroke="#64748b"/>
    <text x="45" y="81" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">M3</text>
    <text x="105" y="70" font-size="10" font-weight="600" fill="#0f172a">Front-Right</text>
    <text x="105" y="86" font-size="9" fill="#64748b">BO 1:48 Gear</text>

    <!-- Motor 4 (Rear Right) -->
    <rect x="15" y="125" width="150" height="70" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <circle cx="45" cy="160" r="18" fill="#e2e8f0" stroke="#64748b"/>
    <text x="45" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">M4</text>
    <text x="105" y="153" font-size="10" font-weight="600" fill="#0f172a">Rear-Right</text>
    <text x="105" y="169" font-size="9" fill="#64748b">BO 1:48 Gear</text>

    <text x="90" y="215" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2563eb">Connected in Parallel to OUT3/OUT4</text>
  </g>

  <!-- WIRING TRACES -->
  <!-- Left Motor Wiring -->
  <path d="M 298, 290 L 220, 260" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <path d="M 298, 320 L 220, 330" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>

  <!-- Right Motor Wiring -->
  <path d="M 652, 290 L 730, 260" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <path d="M 652, 320 L 730, 330" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>

  <!-- Arduino Interface Banner Below -->
  <g transform="translate(180, 520)">
    <rect width="590" height="70" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shd3)"/>
    <text x="295" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">ARDUINO UNO LOGIC PIN CONNECTIONS</text>
    <g font-size="10" font-family="'JetBrains Mono', monospace" fill="#334155" text-anchor="middle">
      <text x="65" y="48">ENA: D5 (PWM)</text>
      <text x="160" y="48">IN1: D6</text>
      <text x="235" y="48">IN2: D7</text>
      <text x="310" y="48">IN3: D8</text>
      <text x="385" y="48">IN4: D9</text>
      <text x="495" y="48">ENB: D10 (PWM)</text>
    </g>
  </g>
</svg>
