<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 620" width="100%" height="100%" style="background:#ffffff; font-family:'Inter', system-ui, sans-serif;">
  <defs>
    <filter id="shd4" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="ir-pcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect x="15" y="15" width="920" height="590" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="475" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">DUAL TCRT5000 IR SENSORS INTERFACE &amp; PRINCIPLE</text>
  <text x="475" y="68" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">OPTICAL LINE TRACKING, LM393 COMPARATOR CIRCUITRY &amp; TRUTH TABLE</text>

  <!-- LEFT IR MODULE (Physical Hardware Representation) -->
  <g transform="translate(60, 105)">
    <rect width="250" height="260" rx="10" fill="url(#ir-pcb)" stroke="#065f46" stroke-width="2" filter="url(#shd4)"/>
    <text x="125" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">LEFT IR MODULE (TCRT5000)</text>

    <!-- Optical Sensor Head -->
    <rect x="75" y="42" width="100" height="45" rx="5" fill="#0f172a" stroke="#1e293b"/>
    <!-- IR Emitter (Blue lens) -->
    <circle cx="105" cy="65" r="14" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
    <text x="105" y="69" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">LED</text>
    <!-- IR Receiver (Dark phototransistor) -->
    <circle cx="145" cy="65" r="14" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="145" y="69" text-anchor="middle" font-size="8" font-weight="700" fill="#94a3b8">REC</text>

    <!-- LM393 Comparator IC -->
    <rect x="85" y="110" width="80" height="35" rx="3" fill="#1e293b" stroke="#334155"/>
    <text x="125" y="132" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">LM393 OP-AMP</text>

    <!-- Trimpot (Blue box with brass screw) -->
    <rect x="95" y="160" width="60" height="30" rx="3" fill="#1d4ed8"/>
    <circle cx="125" cy="175" r="6" fill="#facc15" stroke="#ca8a04"/>
    <text x="125" y="202" text-anchor="middle" font-size="8" fill="#e2e8f0">Threshold Trimmer</text>

    <!-- Pin Headers (Bottom) -->
    <g transform="translate(45, 225)">
      <rect width="160" height="25" rx="3" fill="#0f172a"/>
      <circle cx="20" cy="12" r="3.5" fill="#fde047"/>
      <circle cx="60" cy="12" r="3.5" fill="#fde047"/>
      <circle cx="100" cy="12" r="3.5" fill="#fde047"/>
      <circle cx="140" cy="12" r="3.5" fill="#fde047"/>
      <text x="20" y="34" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">VCC</text>
      <text x="60" y="34" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">GND</text>
      <text x="100" y="34" text-anchor="middle" font-size="8" font-weight="700" fill="#38bdf8">D0</text>
      <text x="140" y="34" text-anchor="middle" font-size="8" font-weight="700" fill="#94a3b8">A0</text>
    </g>
  </g>

  <!-- RIGHT IR MODULE -->
  <g transform="translate(640, 105)">
    <rect width="250" height="260" rx="10" fill="url(#ir-pcb)" stroke="#065f46" stroke-width="2" filter="url(#shd4)"/>
    <text x="125" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">RIGHT IR MODULE (TCRT5000)</text>

    <!-- Optical Sensor Head -->
    <rect x="75" y="42" width="100" height="45" rx="5" fill="#0f172a" stroke="#1e293b"/>
    <circle cx="105" cy="65" r="14" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
    <text x="105" y="69" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">LED</text>
    <circle cx="145" cy="65" r="14" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="145" y="69" text-anchor="middle" font-size="8" font-weight="700" fill="#94a3b8">REC</text>

    <!-- LM393 Comparator IC -->
    <rect x="85" y="110" width="80" height="35" rx="3" fill="#1e293b" stroke="#334155"/>
    <text x="125" y="132" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">LM393 OP-AMP</text>

    <!-- Trimpot -->
    <rect x="95" y="160" width="60" height="30" rx="3" fill="#1d4ed8"/>
    <circle cx="125" cy="175" r="6" fill="#facc15" stroke="#ca8a04"/>
    <text x="125" y="202" text-anchor="middle" font-size="8" fill="#e2e8f0">Threshold Trimmer</text>

    <!-- Pin Headers (Bottom) -->
    <g transform="translate(45, 225)">
      <rect width="160" height="25" rx="3" fill="#0f172a"/>
      <circle cx="20" cy="12" r="3.5" fill="#fde047"/>
      <circle cx="60" cy="12" r="3.5" fill="#fde047"/>
      <circle cx="100" cy="12" r="3.5" fill="#fde047"/>
      <circle cx="140" cy="12" r="3.5" fill="#fde047"/>
      <text x="20" y="34" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">VCC</text>
      <text x="60" y="34" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">GND</text>
      <text x="100" y="34" text-anchor="middle" font-size="8" font-weight="700" fill="#38bdf8">D0</text>
      <text x="140" y="34" text-anchor="middle" font-size="8" font-weight="700" fill="#94a3b8">A0</text>
    </g>
  </g>

  <!-- ARDUINO UNO INTERFACE (Center Box) -->
  <g transform="translate(350, 130)">
    <rect width="250" height="210" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2" filter="url(#shd4)"/>
    <rect width="250" height="30" rx="10" fill="#0891b2"/>
    <text x="125" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ARDUINO UNO INPUTS</text>

    <text x="15" y="55" font-size="11" font-weight="600" fill="#0f172a">Power Rails:</text>
    <text x="15" y="75" font-size="10.5" fill="#dc2626">5V Rail ──► VCC (Both Sensors)</text>
    <text x="15" y="95" font-size="10.5" fill="#334155">GND Rail ──► GND (Both Sensors)</text>

    <line x1="15" y1="110" x2="235" y2="110" stroke="#e2e8f0" stroke-width="1.5"/>

    <text x="15" y="132" font-size="11" font-weight="600" fill="#0f172a">Digital Sensor Inputs:</text>
    <text x="15" y="152" font-size="11" font-family="'JetBrains Mono', monospace" fill="#047857">Pin A2 ◄── Left IR D0</text>
    <text x="15" y="174" font-size="11" font-family="'JetBrains Mono', monospace" fill="#047857">Pin A3 ◄── Right IR D0</text>
    <text x="15" y="196" font-size="9" fill="#64748b">Configured as INPUT (digitalRead)</text>
  </g>

  <!-- TRACE LINES -->
  <path d="M 205, 345 L 350, 282" fill="none" stroke="#047857" stroke-width="2.5"/>
  <path d="M 740, 345 L 600, 304" fill="none" stroke="#047857" stroke-width="2.5"/>

  <!-- LOWER SECTION: LINE TRACKING LOGIC & TRUTH TABLE -->
  <g transform="translate(60, 400)">
    <rect width="830" height="185" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shd4)"/>
    <text x="415" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">LINE FOLLOWING DECISION MATRIX (2-SENSOR TRUTH TABLE)</text>

    <g transform="translate(20, 40)">
      <!-- Table Header -->
      <rect width="790" height="28" fill="#f1f5f9" rx="4"/>
      <text x="70" y="18" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">Left Sensor (A2)</text>
      <text x="210" y="18" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">Right Sensor (A3)</text>
      <text x="360" y="18" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">Detected Track Condition</text>
      <text x="540" y="18" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">Robot Navigational Action</text>
      <text x="710" y="18" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">Motor State (L / R)</text>

      <!-- Row 1 -->
      <line x1="0" y1="54" x2="790" y2="54" stroke="#f1f5f9" stroke-width="1"/>
      <text x="70" y="44" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#059669">0 (White)</text>
      <text x="210" y="44" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#059669">0 (White)</text>
      <text x="360" y="44" text-anchor="middle" font-size="10" fill="#0f172a">Robot centered over track</text>
      <text x="540" y="44" text-anchor="middle" font-size="10" font-weight="700" fill="#2563eb">Move Straight Forward</text>
      <text x="710" y="44" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#1e40af">PWM 160 / 160</text>

      <!-- Row 2 -->
      <line x1="0" y1="80" x2="790" y2="80" stroke="#f1f5f9" stroke-width="1"/>
      <text x="70" y="70" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#dc2626">1 (Black)</text>
      <text x="210" y="70" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#059669">0 (White)</text>
      <text x="360" y="70" text-anchor="middle" font-size="10" fill="#0f172a">Car drifted to the right</text>
      <text x="540" y="70" text-anchor="middle" font-size="10" font-weight="700" fill="#ea580c">Steer Left (Re-align)</text>
      <text x="710" y="70" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#c2410c">Reverse L / Fwd R</text>

      <!-- Row 3 -->
      <line x1="0" y1="106" x2="790" y2="106" stroke="#f1f5f9" stroke-width="1"/>
      <text x="70" y="96" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#059669">0 (White)</text>
      <text x="210" y="96" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#dc2626">1 (Black)</text>
      <text x="360" y="96" text-anchor="middle" font-size="10" fill="#0f172a">Car drifted to the left</text>
      <text x="540" y="96" text-anchor="middle" font-size="10" font-weight="700" fill="#ea580c">Steer Right (Re-align)</text>
      <text x="710" y="96" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#c2410c">Fwd L / Reverse R</text>

      <!-- Row 4 -->
      <text x="70" y="122" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#dc2626">1 (Black)</text>
      <text x="210" y="122" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#dc2626">1 (Black)</text>
      <text x="360" y="122" text-anchor="middle" font-size="10" fill="#0f172a">Stop line / T-junction</text>
      <text x="540" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">Full Stop / Standby</text>
      <text x="710" y="122" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#991b1b">PWM 0 / 0</text>
    </g>
  </g>
</svg>
